<style>
/* =========================================================================
   PERSPECTIVE PRACTICE ROOM — shared styles (same for every issue)
   Layout: magazine masthead, mode bar, pill tab bar, one activity panel at a time.
   ========================================================================= */
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#f3f0e8; --ink:#1a2a5e;
  --muted:#555d6b; --muted-strong:#475569;
  --navy:#1a2a5e; --onnavy:#ffffff; --ticket:#d4af37; --onticket:#0b2c5f;
  --line:#d8dce4; --good:#1b7d52; --good-bg:#e6f4ed; --bad:#b83a33; --bad-bg:#fbeceb;
  --focus:#1a2a5e;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:740px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:6px;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.4rem;letter-spacing:.12em}
.issue{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;margin:18px 0 6px;text-wrap:balance}
.dek{color:var(--muted);margin:0;max-width:60ch}
.level{display:inline-block;background:var(--ticket);color:var(--onticket);font-weight:700;font-size:.75rem;letter-spacing:.08em;padding:3px 8px;border-radius:3px;margin-top:10px}

/* mode bar */
.modebar{margin-top:20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:8px;padding:3px;gap:3px;background:var(--surface)}
.seg button{border:0;background:transparent;font-weight:600;font-size:.92rem;padding:8px 14px;border-radius:5px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--onnavy)}
.fs-btn{margin-left:auto;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:.85rem;font-weight:600;color:var(--muted-strong);min-height:40px}
.mode-desc{flex-basis:100%;margin:0;color:var(--muted);font-size:.92rem}
.fs-msg{flex-basis:100%;margin:0;font-size:.88rem;color:var(--muted-strong);background:var(--tint);border-radius:6px;padding:8px 10px}

/* tabs */
nav{display:flex;gap:6px;overflow-x:auto;margin:18px 0 14px;padding:2px 2px 6px}
nav button{flex:0 0 auto;font-weight:600;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;min-height:40px}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.p-head{display:flex;flex-direction:column;gap:6px}
.kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--navy)}
h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;line-height:1.15;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:.95rem;max-width:62ch}
.team{margin:0;font-size:.95rem;background:var(--tint);border-left:4px solid var(--ticket);padding:8px 12px;border-radius:0 6px 6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.btn{font-weight:600;font-size:.95rem;background:var(--navy);color:var(--onnavy);border:1.5px solid var(--navy);border-radius:6px;padding:10px 16px;min-height:44px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-weight:700;font-variant-numeric:tabular-nums;margin:0}
.status.win{color:var(--good)}
.pnav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.pnav button{border:0;background:none;color:var(--navy);font-weight:600;padding:6px 0;font-size:.92rem}
.pnav span{flex:1}

/* 1 flashcards */
.card{display:block;width:100%;perspective:1200px;background:none;border:0;padding:0;text-align:center}
.card-in{display:grid;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:10px}
.front{background:var(--navy);color:var(--onnavy)}
.front .w{font-family:var(--display);font-size:2.4rem;line-height:1.1}
.back{background:var(--tint);border:2px dashed var(--navy);transform:rotateY(180deg)}
.back .w-small{font-family:var(--display);font-size:1.1rem;color:var(--navy)}
.back .def{font-size:1.1rem;font-weight:600;max-width:34ch}
.back .ex{color:var(--muted);font-style:italic;font-size:.95rem;max-width:44ch}
.pos{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.tap{font-size:.8rem;opacity:.8}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

/* 2 match */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{display:flex;gap:10px;align-items:center;text-align:left;background:var(--tint);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.95rem;min-height:46px;width:100%}
.tile .lab{flex:0 0 auto;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;min-width:1.2em}
.tile .txt{flex:1;min-width:0}
.tile.word .txt{font-weight:700}
.tile .badge{flex:0 0 auto;font-size:.8rem;font-weight:700;background:var(--navy);color:var(--onnavy);border-radius:4px;padding:2px 7px}
.tile.sel{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.tile.ok{border-color:var(--good);background:var(--good-bg)}
.tile.ok .txt,.tile.ok .lab{color:var(--good)}
.tile.no{border-color:var(--bad);background:var(--bad-bg)}
.tile.locked{cursor:default}
.tile.wrong{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 3 gap fill */
.wordbox{display:flex;flex-wrap:wrap;gap:6px;border:1.5px dashed var(--line);border-radius:8px;padding:10px}
.chip{background:var(--tint);border-radius:4px;padding:3px 10px;font-weight:600;font-size:.92rem}
.gaps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.gaps li{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.gaps .num{font-weight:700;color:var(--navy);flex:0 0 auto;line-height:2.1}
.gaps .sent{flex:1;min-width:0;line-height:2.1;margin:0}
select{background:var(--tint);border:1.5px solid var(--line);border-radius:5px;padding:4px 6px;font-weight:600;min-height:38px;max-width:100%}
select.ok{border-color:var(--good);color:var(--good);background:var(--good-bg)}
select.no{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.answer{display:inline-block;font-size:.85rem;font-weight:700;color:var(--good);background:var(--good-bg);border-radius:4px;padding:1px 8px;margin-left:4px;line-height:1.6}
.mini{border:1.5px solid var(--navy);background:transparent;color:var(--navy);font-weight:600;font-size:.85rem;border-radius:5px;padding:6px 10px;min-height:38px;flex:0 0 auto}

/* 4 true or false */
.tf{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.tfq{display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tfq .top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.tfq .stmt{min-width:0;margin:0}
.tfb{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.tfb button{min-width:46px;height:42px;font-weight:700;border-radius:6px;border:1.5px solid var(--line);background:var(--tint)}
.tfb button.chosen{border-color:var(--navy);background:var(--navy);color:var(--onnavy)}
.tfb button.ok{background:var(--good);border-color:var(--good);color:#fff}
.tfb button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.why{margin:0;font-size:.92rem;color:var(--muted-strong);background:var(--tint);border-radius:6px;padding:8px 10px}
.why b{color:var(--good)}

/* 5 council */
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--tint);border-radius:6px;padding:10px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.75rem}
.measures{display:grid;gap:10px}
.mwrap{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.mwrap.on{border-color:var(--navy);background:var(--tint)}
.measure{display:flex;gap:12px;align-items:flex-start;padding:12px;border:0;background:transparent;text-align:left;width:100%;border-radius:8px}
.box{flex:0 0 24px;height:24px;border:2px solid var(--navy);border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--onnavy);margin-top:1px}
.sq .box{border-radius:50%}
.mwrap.on .box{background:var(--navy)}
.mtxt{min-width:0;display:flex;flex-direction:column;gap:2px}
.mtxt strong{font-size:1rem}
.mtxt .fix{font-size:.9rem}
.mtxt .pay{font-size:.85rem;color:var(--bad)}
.tally{display:flex;align-items:center;gap:8px;padding:0 12px 12px 48px;font-size:.88rem;color:var(--muted-strong)}
.tally button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;font-weight:700;font-size:1.1rem}
.tally output{min-width:2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.or{margin:2px 0;text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.verdict{background:var(--navy);color:var(--onnavy);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.verdict h3{font-family:var(--display);font-weight:400;margin:0;font-size:1.35rem}
.verdict p{margin:0}
.verdict ul,.verdict ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.verdict .eff{display:block;font-size:.92rem;opacity:.92}
.verdict .small{font-size:.82rem;opacity:.8}
.think{background:var(--surface);color:var(--ink);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.think .kicker{color:var(--navy)}
.verdict .btn.ghost{color:var(--onnavy);border-color:var(--onnavy);align-self:flex-start}

/* call to action */
.cta{margin-top:24px;border:2px solid var(--ticket);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface)}
.cta ul{margin:0;padding-left:20px;color:var(--muted-strong);font-size:.95rem}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
footer{margin-top:24px;color:var(--muted);font-size:.8rem;text-align:center}

/* ---------- Classroom Mode: projector scale and stronger contrast ---------- */
body.is-class{font-size:20px;--muted:var(--muted-strong)}
.is-class .wrap{max-width:1100px}
.is-class h1{font-size:clamp(2.6rem,6vw,4rem)}
.is-class .dek,.is-class .hint,.is-class .mode-desc{font-size:1rem}
.is-class nav button{font-size:1rem;padding:10px 18px;min-height:48px}
.is-class .panel{padding:clamp(20px,3vw,36px);gap:20px;border-width:2px}
.is-class h2{font-size:clamp(1.8rem,3.4vw,2.4rem)}
.is-class .btn{font-size:1.05rem;padding:12px 20px;min-height:52px}
.is-class .mini{font-size:.95rem;min-height:46px;padding:8px 14px}
.is-class .card-in{min-height:360px}
.is-class .front .w{font-size:clamp(3rem,8vw,5rem)}
.is-class .back .def{font-size:clamp(1.3rem,2.6vw,1.9rem);max-width:30ch}
.is-class .back .ex{font-size:1.05rem}
.is-class .tile{font-size:1.05rem;padding:14px 16px;min-height:58px}
.is-class .gaps .sent,.is-class .gaps .num{font-size:1.15rem}
.is-class select{font-size:1.05rem;min-height:46px}
.is-class .tfq .stmt{font-size:1.15rem}
.is-class .tfb button{min-width:58px;height:52px;font-size:1.1rem}
.is-class .why{font-size:1rem}
.is-class .mtxt strong{font-size:1.15rem}
.is-class .mtxt .fix{font-size:1rem}
.is-class .mtxt .pay{font-size:.95rem}
.is-class .tally{font-size:.95rem}
.is-class .tally button{width:44px;height:44px}
.is-class .verdict h3{font-size:1.7rem}
.is-class .stat b{font-size:1.8rem}
@media (min-width:900px){.is-class .measures{grid-template-columns:1fr 1fr}}

@media (max-width:520px){
  .match{grid-template-columns:1fr}
  .tfq .top{flex-direction:column;align-items:flex-start}
  .tally{padding-left:12px}
  .fs-btn{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}.tile.wrong{animation:none}}

/* Perspective English styling from the supplied page and ORIGINAL perspective.css */
.wrap{max-width:920px;padding-top:28px}
.mast{align-items:center;border-bottom:1px solid #1a2a5e;padding-bottom:18px}
.brand-link{display:flex;flex-direction:column;gap:0;text-decoration:none;color:#1a2a5e}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:46px;letter-spacing:1px;line-height:.95}
.brand-tagline{font-family:Arial,Helvetica,sans-serif;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:5px;line-height:1.5;text-transform:uppercase;color:#1a2a5e}
.issue{color:#987b36;font-size:.75rem;font-weight:800}
header:has(.mast) h1{font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(2.2rem,5vw,3.65rem);line-height:1.14;color:#1a2a5e;margin:35px 0 14px}
header:has(.mast) h1::after{content:"";display:block;width:68px;height:3px;background:#b79a4e;margin:20px 0 0}
.dek{line-height:1.65;color:#555d6b;font-size:1.05rem;max-width:690px}
.level{background:#1a2a5e;color:#fff;border-radius:999px;padding:6px 13px;font-weight:800}
.panel{border-radius:8px;box-shadow:0 4px 14px rgba(11,44,95,.055);padding:26px}
h2,.verdict h3,.front .w,.back .w-small,.stat b{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.kicker{color:#987b36;font-weight:800}
.btn{border-radius:4px;font-weight:800}
nav button{font-weight:700}
.cta{background:#f3f0e8;border:1px solid rgba(11,44,95,.18);border-radius:10px;padding:26px}
.cta h2{color:#0b2c5f}
@media(max-width:850px){.brand{font-size:38px}.brand-tagline{letter-spacing:4px}}
@media(max-width:520px){.mast{align-items:flex-start}.issue{padding-top:6px}.panel{padding:17px}.brand{font-size:clamp(27px,8vw,38px)}.brand-tagline{font-size:8px;letter-spacing:clamp(1px,.8vw,4px)}}

/* LEVEL COLOR — the only part that changes between A, B and C */
:root{--navy:#451a2a;--focus:#451a2a}
.mast{border-bottom-color:#451a2a}
.brand-link,.brand-tagline{color:#451a2a}
header:has(.mast) h1,h2,.cta h2{color:#451a2a}
.level{background:#451a2a}
.levels a[aria-current="page"]{background:#451a2a;border-color:#451a2a;color:#fff}

/* Level links, assumption marker and result details (shared) */
.level{display:none} /* the level links below show the current level */
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.levels a{display:inline-flex;align-items:center;padding:6px 12px;border:1px solid rgba(11,44,95,.22);border-radius:999px;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.2px;color:#0b2c5f;background:#fff}
.mtxt .fix b{font-weight:700}
.mtxt .fix.quote{font-style:italic}
.mtxt .fix.quote b{font-style:normal}
.mtxt .pay.assume{color:var(--muted-strong)}
.weakrow{padding:0 12px 12px 48px}
.weak{border:1.5px dashed var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700;color:var(--muted-strong);min-height:34px}
.weak.on{border-style:solid;border-color:#b79a4e;background:#f7efd6;color:#5c4710}
.mwrap.is-weak{border-color:#b79a4e}
.verdict .eff b{font-weight:700}
.effs{display:flex;flex-direction:column;gap:4px}
.verdict .link{background:rgba(255,255,255,.12);border-radius:6px;padding:8px 10px}
.is-class .weak{font-size:.95rem;min-height:42px}
.town{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
/* Activity 5: sort ("Where is the line?") */
.sort,.heads{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.srow,.hrow{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.srow.picked,.hrow.on{border-color:var(--navy);background:var(--tint)}
.stext,.shint,.stress,.study{margin:0}
.stext{font-weight:700}
.shint,.stress{font-size:.9rem;color:var(--muted-strong)}
.schoices{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.schoice{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem;min-height:40px}
.schoice.on{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}
.schoice.c-cheat.on{background:var(--bad);border-color:var(--bad);color:#fff}
.schoice.c-fine.on,.schoice.c-ok.on{background:var(--good);border-color:var(--good);color:#fff}
.schoice.c-gray.on,.schoice.c-unsure.on{background:#6b7280;border-color:#6b7280;color:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted-strong)}
.field input{font:inherit;font-size:1rem;color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:9px 11px;background:#fff;min-height:42px;width:100%}
.field input:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.field.rule{background:var(--tint);border-radius:8px;padding:12px 14px}
.sgroup{display:flex;flex-direction:column;gap:4px}
.sgroup ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
/* Activity 5: headlines */
.study{background:var(--tint);border-left:4px solid #b79a4e;padding:10px 14px;border-radius:0 6px 6px 0}
.htop{display:flex;gap:12px;align-items:flex-start}
.hnum{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--navy);min-width:1.2em}
.hbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.headline{margin:0;font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.25;color:var(--ink)}
.pick{border:1.5px solid var(--navy);background:var(--surface);color:var(--navy);border-radius:6px;padding:7px 12px;font-weight:700;font-size:.88rem;min-height:40px}
.pick.on{background:var(--navy);color:var(--onnavy)}

const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

/* Small DOM helper: el("button", {class:"btn", text:"Go", onclick: fn}, child, ...) */
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; n.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return n;
}

/* Re-render a panel, keeping keyboard focus on the same control (data-fid). */
/* Some phone browsers jump up the page when a panel is redrawn after a tap. Keep the reader where they were,
   unless the room itself chose to scroll (intendScroll), e.g. to show a result or a new activity. */
let scrollIntent = 0;
function intendScroll(){ scrollIntent = Date.now(); }
function holdScroll(y){
  const back = () => { try { if (Date.now() - scrollIntent > 1500 && Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y); } catch (e) {} };
  back(); (window.requestAnimationFrame || (f => setTimeout(f, 16)))(back); setTimeout(back, 80);
}
function paint(id, build){
  const p = $(id), y = window.scrollY;
  const a = document.activeElement;
  const fid = a && p.contains(a) ? a.getAttribute("data-fid") : null;
  p.replaceChildren(...build().filter(Boolean));
  if (id === "p-council" && typeof wtwAttach === "function") wtwAttach();
  if (fid) { const t = p.querySelector('[data-fid="' + fid + '"]'); if (t) t.focus({ preventScroll: true }); }
  if (typeof TOOLS !== "undefined" && TOOLS.open === "results") renderResults();
  holdScroll(y);
}

/* ---------------- state ---------------- */
const state = {
  mode: "solo",
  tab: "cards",
  cards: { i: 0, shown: false, seen: new Set() },
  match: null,
  gap: null,
  tf: null,
  council: null
};
const isClass = () => state.mode === "class";

function resetMatch(){
  const keys = ISSUE.vocab.map(v => v.word);
  state.match = { words: shuffle(keys), defs: shuffle(keys), sel: null, pairs: {}, done: new Set(), tries: 0, checked: false, flash: null };
}
function resetGap(){ state.gap = { vals: ISSUE.gaps.map(() => ""), checked: false, revealed: new Set() }; }
function resetTF(){ state.tf = { ans: ISSUE.truefalse.map(() => null), revealed: new Set() }; }
function freshThink(){
  if (TYPE === "sort") return { votes: K.items.map(() => ({})), fvotes: {}, picks: K.items.map(() => null), depends: K.items.map(() => ""), asks: K.items.map(() => ""), prices: K.items.map(() => ""), finals: {}, rule: "", text: "", text2: "", num: "", nums: [], shown: new Set(), voted: false };
  if (TYPE === "rank") return { tops: K.items.map(() => 0), bots: K.items.map(() => 0), order: K.items.map((_, i) => i), moved: false, text: "", line: null, asks: K.items.map(() => ""), voted: false };
  if (TYPE === "allocate") return { judge: K.items.map(() => null), pts: K.items.map(() => 0), hard: null, shown: new Set(), voted: false,
    order: K.criteria ? K.criteria.items.map((_, i) => i) : [], moved: false, fields: {} };
  if (TYPE === "grid") return { ranks: K.rows.map(() => ({})), own: null, rowPick: {}, text: "", voted: false };
  if (TYPE === "decisions") return { tv: {}, vals: Object.fromEntries(K.rows.map(r => [r.id, r.type === "multi" ? [] : (r.type === "choice" ? null : "")])), lose: Object.fromEntries(K.rows.map(r => [r.id, ""])), voted: false };
  if (TYPE === "design") return { rows: Array.from({ length: K.min || 3 }, () => ({ name: "", dates: "", why: "", kind: null })), voted: false };
  if (TYPE === "headlines") return { notes: K.items.map(() => ""), rates: scales().map(() => K.items.map(() => null)), choice: null, second: null, word: "", revealed: new Set(), teams: K.items.map(() => 0), voted: false };
  return { sel: new Set(), statusQuo: false, weak: null, teams: K.measures.map(() => 0).concat([0]), voted: false };
}
function resetCouncil(full){
  if (!state.council || full) state.council = freshThink();
  const C = state.council;
  C.voted = false;
  if (C.revealed) C.revealed.clear();   // model answers stay hidden after a mode switch
  if (C.shown) C.shown.clear();
}

/* ---------------- shared pieces ---------------- */
function head(n, t, title){
  return el("div", { class: "p-head" },
    el("span", { class: "kicker", text: "Activity " + n + " · " + t.kicker }),
    el("h2", { text: title || t.title }),
    el("p", { class: "hint", text: isClass() ? t.cls : t.solo }),
    isClass() && t.team ? el("p", { class: "team" }, el("b", { text: "In teams: " }), t.team) : null
  );
}
function panelNav(id){
  const i = TABS.findIndex(t => t.id === id);
  const prev = TABS[i - 1], next = TABS[i + 1];
  return el("div", { class: "pnav" },
    prev ? el("button", { type: "button", "data-fid": "pprev", onclick: () => goTab(prev.id, true), text: "← " + prev.label }) : el("span"),
    next ? el("button", { type: "button", "data-fid": "pnext", onclick: () => goTab(next.id, true), text: next.label + " →" }) : el("span")
  );
}

/* ================= Activity 1: Flashcards ================= */
function renderCards(){
  const S = state.cards, V = ISSUE.vocab, v = V[S.i], cls = isClass(), t = UI.cards;
  paint("p-cards", () => {
    const front = el("span", { class: "face front", id: "cardFront", "aria-hidden": S.shown ? "true" : "false" },
      el("span", { class: "pos", text: v.pos }),
      el("span", { class: "w", text: v.word }),
      cls ? null : el("span", { class: "tap", text: t.tap }));
    const back = el("span", { class: "face back", id: "cardBack", "aria-hidden": S.shown ? "false" : "true" },
      el("span", { class: "w-small", text: v.word }),
      el("span", { class: "def", text: v.def }),

    const inner = el("span", { class: "card-in" }, front, back);
    const card = cls
      ? el("div", { class: "card" + (S.shown ? " flip" : ""), id: "card" }, inner)
      : el("button", { type: "button", class: "card" + (S.shown ? " flip" : ""), id: "card", "data-fid": "card",
          "aria-label": "Flashcard: " + v.word + ". Press to flip.", onclick: flipCard }, inner);
    return [
      head(1, t, cls ? t.classTitle : t.soloTitle),
      card,
      el("div", { class: "row split" },
        el("button", { type: "button", class: "btn ghost", "data-fid": "cprev", onclick: () => moveCard(-1), text: "← Back" }),
        el("span", { class: "count", "aria-live": "polite", text: "Card " + (S.i + 1) + " of " + V.length }),
        el("button", { type: "button", class: "btn", "data-fid": "cnext", onclick: () => moveCard(1), text: "Next →" })),
      el("div", { class: "row" },
        cls ? el("button", { type: "button", class: "btn", id: "revealBtn", "data-fid": "creveal", "aria-pressed": S.shown ? "true" : "false",
          onclick: flipCard, text: S.shown ? "Hide meaning" : "Reveal meaning" }) : null,
        el("button", { type: "button", class: "btn ghost", "data-fid": "crestart", onclick: () => { S.i = 0; S.shown = false; renderCards(); }, text: "Start again" })),

    ];
  });
}
function flipCard(){
  const S = state.cards; S.shown = !S.shown;
  if (S.shown) S.seen.add(S.i);
  $("card").classList.toggle("flip", S.shown);
  $("cardFront").setAttribute("aria-hidden", S.shown ? "true" : "false");
  $("cardBack").setAttribute("aria-hidden", S.shown ? "false" : "true");
  const r = $("revealBtn");
  if (r) { r.textContent = S.shown ? "Hide meaning" : "Reveal meaning"; r.setAttribute("aria-pressed", S.shown ? "true" : "false"); }
}
function moveCard(d){
  const S = state.cards, n = ISSUE.vocab.length;
  S.i = (S.i + d + n) % n; S.shown = false; renderCards();
}

/* ================= Activity 2: Matching ================= */
function pick(kind, key){
  const M = state.match;
  if (!isClass() && M.done.has(key)) return;
  if (M.sel && M.sel.kind === kind) { M.sel = M.sel.key === key ? null : { kind, key }; return renderMatch(); }
  if (!M.sel) { M.sel = { kind, key }; return renderMatch(); }
  const w = kind === "w" ? key : M.sel.key;
  const d = kind === "d" ? key : M.sel.key;
  M.sel = null;
  if (isClass()) {
    for (const k of Object.keys(M.pairs)) if (M.pairs[k] === d) delete M.pairs[k];
    M.pairs[w] = d;
    M.checked = false;
  } else if (w === d) {
    M.done.add(w);
  } else {
    M.tries++; M.flash = [w, d];
  }
  renderMatch();
}
function renderMatch(){
  const M = state.match, cls = isClass(), n = ISSUE.vocab.length;
  const defOf = k => ISSUE.vocab.find(v => v.word === k).def;
  const letterOf = k => LETTERS[M.defs.indexOf(k)];
  const numOf = k => M.words.indexOf(k) + 1;

  paint("p-match", () => {
    const words = M.words.map((k, i) => {
      let c = "tile word";
      const paired = M.pairs[k];
      if (M.sel && M.sel.kind === "w" && M.sel.key === k) c += " sel";
      if (!cls && M.done.has(k)) c += " ok locked";
      if (cls && M.checked && paired) c += paired === k ? " ok" : " no";
      if (M.flash && M.flash[0] === k) c += " wrong";
      return el("button", { type: "button", class: c, "data-fid": "w-" + k,
          "aria-pressed": M.sel && M.sel.key === k && M.sel.kind === "w" ? "true" : "false",
          "aria-disabled": !cls && M.done.has(k) ? "true" : null, onclick: () => pick("w", k) },
        el("span", { class: "lab", text: (i + 1) + "" }),
        el("span", { class: "txt", text: k }),
        cls && paired ? el("span", { class: "badge", text: "→ " + letterOf(paired) }) : null);
    });
    const defs = M.defs.map((k, i) => {
      let c = "tile";
      const owner = Object.keys(M.pairs).find(w => M.pairs[w] === k);
      if (M.sel && M.sel.kind === "d" && M.sel.key === k) c += " sel";
      if (!cls && M.done.has(k)) c += " ok locked";
      if (cls && M.checked && owner) c += owner === k ? " ok" : " no";
      if (M.flash && M.flash[1] === k) c += " wrong";
      return el("button", { type: "button", class: c, "data-fid": "d-" + k,
          "aria-pressed": M.sel && M.sel.key === k && M.sel.kind === "d" ? "true" : "false",
          "aria-disabled": !cls && M.done.has(k) ? "true" : null, onclick: () => pick("d", k) },
        el("span", { class: "lab", text: LETTERS[i] }),
        el("span", { class: "txt", text: defOf(k) }),
        cls && owner ? el("span", { class: "badge", text: String(numOf(owner)) }) : null);
    });

    let status, win = false;
    if (!cls) {
      status = M.done.size === n ? "All " + n + " matched. Well done!" : M.done.size + " of " + n + " matched";
      if (M.tries) status += " · " + M.tries + " incorrect " + (M.tries === 1 ? "try" : "tries");
      win = M.done.size === n;
    } else {
      const made = Object.keys(M.pairs).length;
      if (M.checked) {
        const right = Object.keys(M.pairs).filter(w => M.pairs[w] === w).length;
        status = right + " of " + n + " correct"; win = right === n;
      } else status = "Pairs made: " + made + " of " + n;
    }

    return [
      head(2, UI.match),
      el("div", { class: "match" }, el("div", { class: "col" }, words), el("div", { class: "col" }, defs)),
      el("p", { class: "status" + (win ? " win" : ""), "aria-live": "polite", text: status }),
      el("div", { class: "row" },
        cls ? el("button", { type: "button", class: "btn", "data-fid": "mcheck", disabled: Object.keys(M.pairs).length === 0,
          onclick: () => { M.checked = true; M.sel = null; renderMatch(); }, text: "Check matches" }) : null,
        cls ? el("button", { type: "button", class: "btn ghost", "data-fid": "mshow",
          onclick: () => { M.pairs = {}; M.words.forEach(w => M.pairs[w] = w); M.checked = true; M.sel = null; renderMatch(); }, text: "Show answers" }) : null,
        el("button", { type: "button", class: "btn ghost", "data-fid": "mreset", onclick: () => { resetMatch(); renderMatch(); }, text: "Shuffle and restart" })),
      panelNav("match")
    ];
  });

  if (M.flash) setTimeout(() => {
    M.flash = null;
    document.querySelectorAll("#p-match .wrong").forEach(x => x.classList.remove("wrong"));
  }, 450);
}

/* ================= Activity 3: Fill the gap ================= */
function renderGap(){
  const G = state.gap, cls = isClass(), n = ISSUE.gaps.length;
  const shown = g => g.form || g.answer; // the word as it appears in the sentence
  paint("p-gap", () => {
    const items = ISSUE.gaps.map((g, i) => {
      const val = G.vals[i], rev = G.revealed.has(i);
      let mark = "";
      if (!cls && G.checked) mark = val === g.answer ? "ok" : "no";
      if (rev && val) mark = val === g.answer ? "ok" : "no";
      const sel = el("select", { id: "gap" + i, "data-fid": "gap" + i, class: mark || null, "aria-label": "Gap " + (i + 1),
          onchange: e => { G.vals[i] = e.target.value; if (!cls) G.checked = false; renderGap(); } },
        el("option", { value: "", text: "choose…" }),
        ISSUE.gapWords.map(w => el("option", { value: w, text: w, selected: val === w })));
      return el("li", {},
        el("span", { class: "num", text: (i + 1) + "" }),
        el("p", { class: "sent" }, g.before ? g.before + " " : "", sel, (/^[.,?!;:]/.test(g.after) ? "" : " ") + g.after,
          rev ? el("span", { class: "answer", text: "Answer: " + shown(g) }) : null),
        cls && !rev ? el("button", { type: "button", class: "mini", "data-fid": "grev" + i,
          onclick: () => { G.revealed.add(i); renderGap(); }, text: "Reveal" }) : null);
    });

    let status = "";
    if (!cls && G.checked) {
      const right = ISSUE.gaps.filter((g, i) => G.vals[i] === g.answer).length;
      status = right + " of " + n + " correct" + (right === n ? ". Perfect!" : ". Change the red answers and check again.");
    }
    if (cls) status = "Revealed: " + G.revealed.size + " of " + n;
    const allRight = !cls && G.checked && ISSUE.gaps.every((g, i) => G.vals[i] === g.answer);

    return [
      head(3, UI.gap),
      el("div", { class: "wordbox", "aria-label": "Word box" }, ISSUE.gapWords.map(w => el("span", { class: "chip", text: w }))),
      el("ol", { class: "gaps" }, items),
      el("p", { class: "status" + (allRight ? " win" : ""), "aria-live": "polite", text: status }),
      el("div", { class: "row" },
        !cls ? el("button", { type: "button", class: "btn", "data-fid": "gcheck", onclick: () => { G.checked = true; renderGap(); }, text: "Check answers" }) : null,
        !cls && G.checked && !allRight ? el("button", { type: "button", class: "btn ghost", "data-fid": "gshow",
          onclick: () => { ISSUE.gaps.forEach((_, i) => G.revealed.add(i)); renderGap(); }, text: "Show answers" }) : null,
        cls ? el("button", { type: "button", class: "btn", "data-fid": "grevall", disabled: G.revealed.size === n,
          onclick: () => { ISSUE.gaps.forEach((_, i) => G.revealed.add(i)); renderGap(); }, text: "Reveal all" }) : null,
        el("button", { type: "button", class: "btn ghost", "data-fid": "greset", onclick: () => { resetGap(); renderGap(); }, text: "Reset" })),
      panelNav("gap")
    ];
  });
}

/* ================= Activity 4: True or false ================= */
function answerTF(i, v){
  const T = state.tf;
  if (isClass()) {
    if (T.revealed.has(i)) return;
    T.ans[i] = T.ans[i] === v ? null : v;
  } else {
    if (T.ans[i] !== null) return;
    T.ans[i] = v; T.revealed.add(i);
  }
  renderTF();
}
function renderTF(){
  const T = state.tf, cls = isClass(), Q = ISSUE.truefalse, n = Q.length;
  paint("p-tf", () => {
    const items = Q.map((q, i) => {
      const rev = T.revealed.has(i), ans = T.ans[i];
      const btn = (label, v) => {
        let c = "";
        if (rev) { if (v === q.a) c = "ok"; else if (ans === v) c = "no"; }
        else if (ans === v) c = "chosen";
        return el("button", { type: "button", class: c || null, "data-fid": "tf" + i + label,
          "aria-label": (v ? "True" : "False") + ", statement " + (i + 1),
          "aria-pressed": ans === v ? "true" : "false", onclick: () => answerTF(i, v), text: label });
      };
      return el("li", { class: "tfq" },
        el("div", { class: "top" },
          el("p", { class: "stmt", text: (i + 1) + ". " + q.s }),
          el("div", { class: "tfb" }, btn("T", true), btn("F", false),
            cls && !rev ? el("button", { type: "button", class: "mini", "data-fid": "tfrev" + i,
              onclick: () => { T.revealed.add(i); renderTF(); }, text: "Reveal" }) : null)),
        rev ? el("p", { class: "why" }, el("b", { text: (q.a ? "True. " : "False. ") }), q.why) : null);
    });

    let status, win = false;
    if (!cls) {
      const done = T.ans.filter(a => a !== null).length;
      const right = Q.filter((q, i) => T.ans[i] === q.a).length;
      status = done === n ? "Finished: " + right + " of " + n + " correct" : right + " correct so far · " + done + " of " + n + " answered";
      win = done === n && right === n;
    } else status = "Revealed: " + T.revealed.size + " of " + n;

    return [
      head(4, UI.tf),
      el("ol", { class: "tf" }, items),
      el("p", { class: "status" + (win ? " win" : ""), "aria-live": "polite", text: status }),
      el("div", { class: "row" },
        cls ? el("button", { type: "button", class: "btn", "data-fid": "tfrevall", disabled: T.revealed.size === n,
          onclick: () => { Q.forEach((_, i) => T.revealed.add(i)); renderTF(); }, text: "Reveal all" }) : null,
        el("button", { type: "button", class: "btn ghost", "data-fid": "tfreset", onclick: () => { resetTF(); renderTF(); }, text: cls ? "Reset" : "Restart" })),
      panelNav("tf")
    ];
  });
}

/* ================= Activity 5: Council ================= */
function toggleMeasure(i){
  const C = state.council;
  if (!isClass()) C.statusQuo = false;   // Classroom Mode: teams may back rules and "change nothing" side by side
  C.sel.has(i) ? C.sel.delete(i) : C.sel.add(i);
  C.voted = false; renderCouncil();
}
function toggleStatusQuo(){
  const C = state.council;
  C.statusQuo = !C.statusQuo;
  if (C.statusQuo && !isClass()) C.sel.clear();
  C.voted = false; renderCouncil();
}
function toggleWeak(id){
  const C = state.council;
  C.weak = C.weak === id ? null : id;
  C.voted = false; renderCouncil();
}
function setTeams(i, d){
  const C = state.council;
  C.teams[i] = Math.max(0, Math.min(MAX_TEAMS, C.teams[i] + d));
  renderCouncil();
}
function renderCouncil(){
  const C = state.council, cls = isClass(), M = K.measures;
  paint("p-council", () => {
    const passedLabel = C.statusQuo && !C.sel.size ? "None" : C.sel.size + " of " + M.length;
    const tile = (m, on, onclick, fid) => el("button", { type: "button", class: "measure", "data-fid": fid, "aria-pressed": on ? "true" : "false", onclick },
      el("span", { class: "box", "aria-hidden": "true", text: on ? "✓" : "" }),
      el("span", { class: "mtxt" },
        el("strong", { text: m.name }),
        el("span", { class: "fix" + (K.aStyle ? " " + K.aStyle : "") }, K.aLabel ? el("b", { text: K.aLabel + ": " }) : null, m.a),
        el("span", { class: "pay" + (K.bStyle ? " " + K.bStyle : "") }, K.bLabel + ": " + m.b)));
    const weakBtn = (id, name) => K.weakest ? el("div", { class: "weakrow" },
      el("button", { type: "button", class: "weak" + (C.weak === id ? " on" : ""), "data-fid": "wk-" + id,
        "aria-pressed": C.weak === id ? "true" : "false", "aria-label": K.weakest.button + ": " + name,
        onclick: () => toggleWeak(id), text: (C.weak === id ? "✓ " : "") + K.weakest.button })) : null;

    // Classroom Mode: a "Teams in favor" counter on every option, "Change nothing" included (index M.length).
    const tally = (i, name) => cls ? el("div", { class: "tally" },
      el("span", { text: "Teams in favor" }),
      el("button", { type: "button", "data-fid": "tm" + i, "aria-label": "One fewer team in favor of " + name, disabled: C.teams[i] === 0, onclick: () => setTeams(i, -1), text: "−" }),
      el("output", { "aria-live": "polite", "aria-label": "Teams in favor of " + name, text: String(C.teams[i]) }),
      el("button", { type: "button", "data-fid": "tp" + i, "aria-label": "One more team in favor of " + name, disabled: C.teams[i] === MAX_TEAMS, onclick: () => setTeams(i, 1), text: "+" })) : null;
    const list = M.map((m, i) => {
      const on = C.sel.has(i);
      return el("div", { class: "mwrap" + (on ? " on" : "") + (C.weak === i ? " is-weak" : "") },
        tile(m, on, () => toggleMeasure(i), "m" + i),
        tally(i, m.name),
        weakBtn(i, m.name));
    });
    const sq = el("div", { class: "mwrap" + (cls ? "" : " sq") + (C.statusQuo ? " on" : "") + (C.weak === SQ ? " is-weak" : "") },
      tile(K.statusQuo, C.statusQuo, toggleStatusQuo, "msq"), tally(M.length, K.statusQuo.name), weakBtn(SQ, K.statusQuo.name));

    return [
      head(5, UI.council),

/* Timer (Classroom) */
function fmtTime(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function timerTick(){
  const T = TOOLS.timer;
  if (T.run) { T.left = (T.end - Date.now()) / 1000; if (T.left <= 0) { T.left = 0; T.run = false; clearInterval(T.id); } }
  const box = $("timerFloat");
  box.hidden = !T.total || !isClass();
  $("timerFloatTime").textContent = T.left > 0 ? fmtTime(T.left) : "Time's up";
  box.classList.toggle("up", T.total > 0 && T.left <= 0);
  box.classList.toggle("paused", T.total > 0 && T.left > 0 && !T.run);
  const pb = $("timerPause"); if (pb) pb.textContent = T.run ? "Pause" : "Resume";
  if (pb) pb.hidden = T.left <= 0;

function timerStart(min){

  T.total = Math.round(min * 60); T.left = T.total; T.end = Date.now() + T.total * 1000; T.run = true;
  T.id = setInterval(timerTick, 250); timerTick(); toolPanel(null);
}

/* Clicker and keyboard (Classroom) */
function stepTo(sel){ intendScroll(); requestAnimationFrame(() => { const x = document.querySelector(sel); if (x) x.scrollIntoView({ block: "nearest" }); }); }

function clickerFocus(){ const a = document.activeElement; if (a && a.blur) a.blur(); }
function clickerNext(){
  const i = TABS.findIndex(t => t.id === state.tab), next = TABS[i + 1];
  if (state.tab === "cards") {
    const S = state.cards;
    if (!S.shown) return flipCard();
    if (S.i < ISSUE.vocab.length - 1) return moveCard(1);
  } else if (state.tab === "match") {
    const M = state.match;
    if (!M.checked && Object.keys(M.pairs).length) { M.checked = true; M.sel = null; return renderMatch(); }
  } else if (state.tab === "gap") {
    const G = state.gap, j = ISSUE.gaps.findIndex((_, k) => !G.revealed.has(k));
    if (j >= 0) { G.revealed.add(j); renderGap(); return stepTo("#p-gap .gaps > li:nth-child(" + (j + 1) + ")"); }
  } else if (state.tab === "tf") {
    const T = state.tf, j = ISSUE.truefalse.findIndex((_, k) => !T.revealed.has(k));
    if (j >= 0) { T.revealed.add(j); renderTF(); return stepTo("#p-tf .tf > li:nth-child(" + (j + 1) + ")"); }

}

    const S = state.cards;

}
function clickerKey(e){

    ".share-opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;min-height:44px;color:var(--ink);text-decoration:none;font-size:.92rem}" +
    ".share-opt strong{font-size:.95rem}.share-opt span{color:var(--muted);font-size:.82rem}.share-opt:hover,.share-opt[aria-expanded=\"true\"]{border-color:var(--navy)}" +
    ".share-qr{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}" +
    ".share-qr svg{width:min(300px,70vw);height:auto;display:block}.is-class .share-qr svg{width:min(420px,70vw)}" +
    ".share-qr strong{font-size:1.15rem;color:var(--ink)}.share-qr span{font-size:.9rem;color:var(--muted-strong);word-break:break-all;text-align:center}" +
    ".share-embed{display:flex;flex-direction:column;gap:8px}.share-embed p{margin:0;font-size:.9rem}.share-embed .btn{align-self:flex-start}" +
    ".share-embed textarea{width:100%;min-height:110px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical;color:var(--ink);background:var(--surface)}" +
    ".res-card{background:var(--surface);border:2px solid var(--navy);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:520px}" +
    ".res-top{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}.res-top h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}.res-top p{margin:0;font-size:.85rem;color:var(--muted)}" +
    ".res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.res-list li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 8px;align-items:baseline}" +
    ".res-n{grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--navy);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}" +
    ".res-a{font-weight:700;font-size:.95rem}.res-s{font-size:.9rem;color:var(--muted-strong)}.res-list li.full .res-s{color:var(--good);font-weight:700}.res-list li.full .res-n{background:var(--good);color:#fff}" +
    ".res-actions{display:flex;flex-wrap:wrap;gap:8px}" +
    ".res-site{margin:0;font-size:.75rem;letter-spacing:.08em;color:var(--muted);text-align:right}" +
    ".res-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}@media (max-width:520px){.res-fields{grid-template-columns:1fr}}" +
    ".res-cls{font-weight:700;color:var(--navy) !important;font-size:.95rem !important}" +
    ".res-forget{align-self:flex-start;border:0;background:none;padding:4px 0;color:var(--muted-strong);text-decoration:underline;font-size:.85rem;min-height:32px}" +
    "#resName,#resClass{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;min-height:44px;background:var(--surface);color:var(--ink)}" +
    ".timer-presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.timer-custom{display:inline-flex;gap:6px;align-items:center;margin-left:6px}" +
    "#timerMin{width:70px;border:1.5px solid var(--line);border-radius:6px;padding:8px;font:inherit;min-height:40px;background:var(--surface);color:var(--ink)}" +
    ".timer-float{position:fixed;top:14px;right:14px;z-index:50;display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--onnavy);border-radius:12px;padding:8px 10px 8px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}" +
    ".timer-float .tf-time{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center}" +
    ".timer-float.paused .tf-time{opacity:.6}.timer-float.up{animation:tfflash 1s ease-in-out 6;background:var(--bad)}" +
    ".tf-b{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:inherit;border-radius:6px;padding:6px 10px;font-weight:700;min-height:40px}" +
    "@keyframes tfflash{50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.timer-float.up{animation:none}}" +
    "@media (max-width:900px){.share-opts{grid-template-columns:1fr 1fr}}" +
    "@media (max-width:620px){.share-opts{grid-template-columns:1fr}.tools{margin-left:0}}" }));
}

/* ---------------- start ---------------- */
function start(){
  $("issueLabel").textContent = "Issue " + ISSUE.number + " · Practice Room";
  $("issueTitle").textContent = ISSUE.title;
  $("issueDek").textContent = ISSUE.dek;
  $("issueLevel").textContent = ISSUE.level;
  $("backToLesson").href = ISSUE.lessonUrl;
  const ls = $("levelSwitch");
  if (ls && ISSUE.levels) ls.replaceChildren(...ISSUE.levels.map(l =>
    el("a", { href: l.href, "aria-current": l.label === ISSUE.level ? "page" : null, text: l.label + " " + l.name })));
  const c = ISSUE.cta;
  $("cta").replaceChildren(
    el("span", { class: "kicker", text: "The full lesson" }),
    el("h2", { text: c.title }),
    el("p", { class: "hint", text: c.text }),
    el("ul", {}, c.items.map(t => el("li", { text: t }))),
    el("a", { class: "btn", href: ISSUE.lessonUrl, target: "_blank", rel: "noopener", text: c.button + " →" }));

  buildTabs();
  $("modeSolo").addEventListener("click", () => { if (state.mode !== "solo") setMode("solo"); });
  $("modeClass").addEventListener("click", () => { if (state.mode !== "class") setMode("class"); });
  $("fsBtn").addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", updateFsLabel);
  document.addEventListener("webkitfullscreenchange", updateFsLabel);

  // Arrow keys move between flashcards when the flashcard activity is open.
  document.addEventListener("keydown", e => {
    if (state.tab !== "cards" || e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if (t && t.closest && (t.closest("#tabs") || /^(SELECT|INPUT|TEXTAREA)$/.test(t.tagName))) return;
    if (e.key === "ArrowRight") { moveCard(1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { moveCard(-1); e.preventDefault(); }
  });

  let mode = "solo";
  if (location.hash === "#classroom") mode = "class";
  else if (location.hash !== "#solo") { try { if (localStorage.getItem("pe-practice-mode") === "class") mode = "class"; } catch (e) {} }
  toolsInit();
  setMode(mode, true);
  wtwStyle(); teamStyle();
}
start();
})();
</script>
